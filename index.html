<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jiúlia & Vinícius — 08 de Outubro de 2027</title>
  <meta name="description" content="Site de Casamento de Jiúlia e Vinícius. Confirme sua presença, confira a lista de presentes e celebre este momento único conosco.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">
</head>
<body>

  <main class="landing-page">
    <!-- subtle background -->
    <img src="assets/images/planodefundo.jpeg" alt="" class="landing-bg-img">

    <div class="landing-content">
      <!-- Monogram -->
      <div class="nav-monogram" style="margin-bottom: 8px;">
        <div class="monogram-text">
          <span class="monogram-j" style="font-size:2.2rem;">J</span>
          <span class="monogram-sep" style="font-size:1.6rem;">|</span>
          <span class="monogram-v" style="font-size:2.2rem;">V</span>
        </div>
        <img src="assets/images/divider_garland.jpg" alt="Raminhos" class="monogram-garland-img" style="width:180px;">
      </div>

      <h1 class="landing-title">Jiúlia e Vinícius</h1>
      <p class="landing-date">08 DE OUTUBRO DE 2027</p>

      <!-- Decorative divider -->
      <div class="lavender-divider" style="width:160px; margin: 4px auto;">
        <svg viewBox="0 0 200 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="0" y1="10" x2="80" y2="10" stroke="#9d8eb5" stroke-width="0.8" opacity="0.5"/>
          <circle cx="100" cy="10" r="3" fill="#9d8eb5" opacity="0.6"/>
          <circle cx="90" cy="10" r="2" fill="#9d8eb5" opacity="0.4"/>
          <circle cx="110" cy="10" r="2" fill="#9d8eb5" opacity="0.4"/>
          <line x1="120" y1="10" x2="200" y2="10" stroke="#9d8eb5" stroke-width="0.8" opacity="0.5"/>
        </svg>
      </div>

      <!-- Countdown -->
      <div class="landing-countdown">
        <div class="landing-countdown-item">
          <div id="landing-dias" class="landing-countdown-num">---</div>
          <div class="landing-countdown-label">DIAS</div>
        </div>
        <div class="landing-countdown-item">
          <div id="landing-horas" class="landing-countdown-num">--</div>
          <div class="landing-countdown-label">HORAS</div>
        </div>
        <div class="landing-countdown-item">
          <div id="landing-minutos" class="landing-countdown-num">--</div>
          <div class="landing-countdown-label">MINUTOS</div>
        </div>
        <div class="landing-countdown-item">
          <div id="landing-segundos" class="landing-countdown-num">--</div>
          <div class="landing-countdown-label">SEGUNDOS</div>
        </div>
      </div>

      <a href="home.html" class="btn-clique-aqui">CLIQUE AQUI</a>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
